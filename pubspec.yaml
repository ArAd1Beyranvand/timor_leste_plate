name: timor_leste_plate
description: "Timor-Leste's licence plates for the plate_core library — private and government plates with TLS, plus the historical Indonesian and Portuguese Timor plates; themes, alphabet and advisory validators."
version: 0.1.0
repository: https://github.com/ArAd1Beyranvand/timor_leste_plate
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.12.0
  plate_alphabet: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
